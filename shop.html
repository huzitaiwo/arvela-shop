<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop | Arvela</title>
    <meta
      name="description"
      content="Shop Arvela's range of clean, modern and timeless furniture: chairs, sofas, desks, shelves and lamps."
    />
    <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shop.css" />
  </head>
  <body data-header="light">
    <div id="site-header"></div>

    <main id="main" class="shop">
      <div class="container">
        <div class="split-head split-head--compact">
          <h1 class="section-title split-head__title" data-reveal>
            Shop Our Collection
          </h1>
          <div class="split-head__intro" data-reveal style="--i: 1">
            <p>
              Explore our curated range of clean, modern, and timeless
              furniture. Each piece is crafted to bring calm and style to your
              everyday living.
            </p>
          </div>
        </div>

        <div class="shop-toolbar" data-reveal>
          <div class="filters" role="group" aria-label="Filter by category">
            <button
              class="filter"
              type="button"
              data-category=""
              aria-pressed="true"
            >
              All
            </button>
            <button
              class="filter"
              type="button"
              data-category="chair-sofa"
              aria-pressed="false"
            >
              Chair &amp; Sofa
            </button>
            <button
              class="filter"
              type="button"
              data-category="table-desk"
              aria-pressed="false"
            >
              Table &amp; Desk
            </button>
            <button
              class="filter"
              type="button"
              data-category="shelf-accessories"
              aria-pressed="false"
            >
              Shelf &amp; Accessories
            </button>
            <button
              class="filter"
              type="button"
              data-category="light-lamp"
              aria-pressed="false"
            >
              Light &amp; Lamp
            </button>
          </div>
          <div class="shop-toolbar__meta">
            <p class="shop-count" data-shop-count></p>
            <label class="sort">
              <span>Sort by</span>
              <select data-shop-sort>
                <option value="newest">Newest</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
              </select>
            </label>
          </div>
        </div>

        <ul class="product-grid" data-shop-grid aria-busy="true"></ul>

        <div class="shop-state" data-shop-state hidden>
          <h2 class="shop-state__title" data-state-title></h2>
          <p class="shop-state__text" data-state-text></p>
          <button
            class="btn btn--dark btn--sm"
            type="button"
            data-state-action
          ></button>
        </div>

        <div class="shop-more">
          <button class="btn btn--dark" type="button" data-shop-more hidden>
            Load more
          </button>
        </div>

        <p class="sr-only" role="status" data-shop-announce></p>
      </div>
    </main>

    <div id="site-cta"></div>
    <div id="site-footer"></div>

    <script src="js/components.js" defer></script>
    <script src="js/main.js" defer></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/shop.js"></script>
  </body>
</html>
