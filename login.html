<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in | Arvela</title>
    <meta
      name="description"
      content="Sign in to your Arvela account or create one to track your orders."
    />
    <link rel="icon" href="assets/icons/favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/account.css" />
  </head>
  <body data-header="light">
    <div id="site-header"></div>

    <main id="main" class="auth">
      <div class="container">
        <div class="auth__card" data-auth>
          <header class="auth__head">
            <h1
              class="section-title section-title--md"
              tabindex="-1"
              data-auth-title
            >
              Welcome back
            </h1>
            <p class="auth__lead" data-auth-lead>
              Sign in to see your orders and check out faster.
            </p>
          </header>

          <div
            class="segmented"
            role="group"
            aria-label="Sign in or create an account"
            data-segmented
          >
            <button
              class="segmented__btn"
              type="button"
              data-mode="signin"
              aria-pressed="true"
            >
              Sign in
            </button>
            <button
              class="segmented__btn"
              type="button"
              data-mode="signup"
              aria-pressed="false"
            >
              Create account
            </button>
          </div>

          <p class="alert" data-form-status hidden></p>

          <!-- Sign in -->
          <form class="auth__form" data-form="signin" novalidate>
            <div class="field">
              <label class="field__label" for="signin-email">Email</label>
              <input
                class="field__input"
                id="signin-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="signin-email-error"
              />
              <p
                class="field__error"
                id="signin-email-error"
                data-error-for="email"
              ></p>
            </div>
            <div class="field">
              <label class="field__label" for="signin-password">Password</label>
              <div class="field__control">
                <input
                  class="field__input"
                  id="signin-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  minlength="6"
                  aria-describedby="signin-password-error"
                />
                <button
                  class="field__toggle"
                  type="button"
                  data-toggle-password
                  aria-pressed="false"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
              <p
                class="field__error"
                id="signin-password-error"
                data-error-for="password"
              ></p>
            </div>
            <div class="auth__row">
              <button class="text-btn" type="button" data-mode="reset">
                Forgot password?
              </button>
            </div>
            <button class="btn btn--dark btn--block" type="submit">
              Sign in
            </button>
          </form>

          <!-- Create account -->
          <form class="auth__form" data-form="signup" novalidate hidden>
            <div class="field">
              <label class="field__label" for="signup-name">Full name</label>
              <input
                class="field__input"
                id="signup-name"
                name="name"
                type="text"
                autocomplete="name"
                required
                aria-describedby="signup-name-error"
              />
              <p
                class="field__error"
                id="signup-name-error"
                data-error-for="name"
              ></p>
            </div>
            <div class="field">
              <label class="field__label" for="signup-email">Email</label>
              <input
                class="field__input"
                id="signup-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="signup-email-error"
              />
              <p
                class="field__error"
                id="signup-email-error"
                data-error-for="email"
              ></p>
            </div>
            <div class="field">
              <label class="field__label" for="signup-password">Password</label>
              <div class="field__control">
                <input
                  class="field__input"
                  id="signup-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="6"
                  aria-describedby="signup-password-hint signup-password-error"
                />
                <button
                  class="field__toggle"
                  type="button"
                  data-toggle-password
                  aria-pressed="false"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
              <p class="field__hint" id="signup-password-hint">
                At least 6 characters.
              </p>
              <p
                class="field__error"
                id="signup-password-error"
                data-error-for="password"
              ></p>
            </div>
            <button class="btn btn--dark btn--block" type="submit">
              Create account
            </button>
          </form>

          <!-- Reset password -->
          <form class="auth__form" data-form="reset" novalidate hidden>
            <div class="field">
              <label class="field__label" for="reset-email">Email</label>
              <input
                class="field__input"
                id="reset-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="reset-email-error"
              />
              <p
                class="field__error"
                id="reset-email-error"
                data-error-for="email"
              ></p>
            </div>
            <button class="btn btn--dark btn--block" type="submit">
              Send reset link
            </button>
            <button class="text-btn" type="button" data-mode="signin">
              Back to sign in
            </button>
          </form>

          <div class="auth__social" data-social>
            <p class="auth__divider" aria-hidden="true">or</p>
            <button
              class="btn btn--outline btn--block"
              type="button"
              data-google
            >
              <svg class="btn__google" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9Z"
                />
                <path
                  fill="#34A853"
                  d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24Z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.4a12 12 0 0 0 0 10.8l4-3.1Z"
                />
                <path
                  fill="#EA4335"
                  d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8Z"
                />
              </svg>
              Continue with Google
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js" defer></script>
    <script src="js/main.js" defer></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
